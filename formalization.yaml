    quote: '*Remark 8.9.* Observe that if $\Delta$ is a maximal consistent set of formulae, then $\varphi
      \in \Delta$ if and only if $\Delta \vdash_Q \varphi$. It can be shown that in the above definition
      condition (i) can be replaced by condition $(i'')$: If $\{\varphi \dot{-} 2^{-n} : n < \omega\}
      \subseteq \Delta$, then $\varphi \in \Delta$. Indeed, condition $(i'')$ is also independent of (ii)
      in continuous propositional logic.'

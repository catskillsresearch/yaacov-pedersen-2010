    source_line: 335
    quote: '**Lemma 6.2** (*Substitution Lemma*). Let $\mathfrak{M}$ be a continuous $\mathcal{L}$-pre-structure,
      and let $\sigma$ be an $\mathfrak{M}$-assignment. Let $t$ be a term, $x$ be a variable, and $\varphi$
      be a formula. Put $a := t^{\mathfrak{M}, \sigma}$. Suppose $\varphi[t/x]$ is correct. Then $$\mathfrak{M}(\varphi[t/x],
      \sigma) = \mathfrak{M}(\varphi, \sigma_x^a).$$'
  - paper_ref: Lemma 6.4
    lean: ContinuousFOL.bound_substitution_lemma
    file: ContinuousFOL/SubstitutionAndCompletions/BoundSubstitutionLemma.lean
    kind: statement
    source: sources/yaacov_pedersen_2010_vision.md
    source_line: 345
    quote: '**Lemma 6.4 (Bound Substitution Lemma).** *Let $\varphi$ be a formula, and let $x_0, \dots,
      x_{n-1}$ be a finite sequence of variables. Then by a sequence of bound substitutions there is a
      formula $\varphi''$ in which $x_0, \dots, x_{n-1}$ are not bound and $\varphi \equiv \varphi''$.*'

    quote: '**Proposition 9.2.** Let $\mathcal{L}$ be a continuous signature. There exists a continuous
      signature $\mathcal{L}^c$ with $\mathcal{L} \subseteq \mathcal{L}^c$ and a set $\Gamma^c \subseteq
      \mathrm{For}(\mathcal{L}^c)$ such that for every $\Gamma \subseteq \mathrm{For}(\mathcal{L})$, (i)
      $\Gamma \cup \Gamma^c$ is Henkin complete. (ii) If $\Gamma$ is consistent, then $\Gamma \cup \Gamma^c$
      is consistent.'

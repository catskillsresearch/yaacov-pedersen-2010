fidelity:
  divergences: '1. Facts 4.2 and 4.3 (consistent iff satisfiable, Łukasiewicz and continuous propositional
    logic) needed an added premise to go through: there is at least one propositional variable (`[Nonempty
    I]`). As literally stated they are false when there are no variables (the empty set is then satisfiable
    but inconsistent); the counterexample is proved in Lean as `LukPropForm.consistent_iff_satisfiable_fails_empty`
    and `CLPropForm.consistent_iff_satisfiable_fails_empty`. Facts 4.1, 4.4 and 4.5 need no such premise
    (in Fact 4.4 the constant 2^{-n} is built from φ itself via Notation 3.3). This is the only change
    to a paper statement and was approved by the author of the formalization.

    2. Corollary 9.11 (`complete_re_theory_decidable`): "recursive or recursively enumerable axiomatization"
    is read as the structure `RecursivePresentation` (Completeness/RecursivePresentation.lean), which
    besides a computable enumeration of the axioms records a computable map `supClosureCode` on formula
    codes sending the code of φ to the code of its universal (sup-)closure (`supClosureCode_computable`,
    `supClosureCode_spec`). This makes explicit the effectivity of formula codes that the paper uses implicitly;
    see docs/recursive-presentation-cor-9.11.md.

    3. Definition 9.9(ii): `IsCompleteTheory` (Completeness/IsCompleteTheory.lean) quantifies over sentences
    (`IsSentence`), following the paper''s definition of a theory as a set of sentences.

    4. Corollary 9.8 (`pavelka_completeness_pre`/`_metric`): for inconsistent Γ the supremum over the
    empty set is Mathlib''s `Real.sSup_empty` value 0, a convention the paper leaves implicit.

    5. Statements involving "(with a metric)" / "(completely) satisfiable" are given in two Lean forms:
    a `_pre` / unsuffixed version for continuous signatures and pre-structures, and a `_metric` version
    for signatures with a metric and complete structures (Theorem 7.2, Corollaries 9.6 and 9.12, and the
    §8–9 lemmas). Model-existence and entailment statements are universe-polymorphic (`.{u}`).

    6. Some paper statements are split across several Lean theorems (Theorem 7.2 (i)/(ii), Lemma 8.5 (i)/(ii),
    Corollary 6.11 (i)/(ii)); Remark 8.9 is formalized for its first sentence only.'

    quote: '**Fact 4.5 (Finite Strong Completeness for Continuous Logic).** *Let $\mathcal{S}$ be a continuous
      propositional logic, $\Sigma \subseteq \mathcal{S}$ be finite, and $\varphi \in \mathcal{S}$. Then

automation:
  methods:
  - method: agent
    models:
    - Cursor Grok 4.7
    framework: Cursor
    role: Primary agent for Lean 4 / Mathlib formalization, lake build repair, vision-OCR alignment, ContinuousFOL
      writeup, and Palomar packaging.
  - method: agent
    models:
    - Cursor Composer 2.5
    framework: Cursor
    role: Routine scaffolding and medium-complexity proof obligations.
  - method: agent
    models:
    - Claude Fable 5.2
    framework: Cursor
    role: Substantive Lean repairs and larger proof obligations.
  - method: agent
    models:
    - Google Gemini 4 Carbon
    framework: Cursor
    role: Agent and support passes (gemini-4-carbon). Required model card for this project; listed in
      scripts/ai_model_cards.py.
  - method: manual
    models: []
    role: Lars Warren Ericson chose the formalization route and reviewed the Lean development. The human
      author takes responsibility for the report's mathematical claims.
  notes: 'Challenge / Solution / comparator.json / formalization.yaml packaging. Model-card registry:
    scripts/ai_model_cards.py. No other human collaborators. Source authors had no involvement.'
status:
  scope: 'Complete. Every numbered result of the paper that the formalization targets is proved in Lean
    4 / Mathlib: Remark 3.4; the §4 propositional Facts 4.1–4.5 (proved in Lean, not assumed); Lemmas
    6.2 and 6.4, Theorems 6.6, 6.8, 6.9 and Corollary 6.11; Soundness (Theorem 7.2); Theorem 8.1, Lemmas
    8.2–8.6, Remark 8.9, Theorem 8.10, Lemmas 8.11–8.12; Proposition 9.2, Theorem 9.4, Completeness (Theorem
    9.5), Corollaries 9.6, 9.8, 9.11 and 9.12. The ContinuousFOL library is sorry-free and declares no
    Lean `axiom`; every listed theorem depends only on propext, Classical.choice and Quot.sound (some
    on a subset). The only `sorry`s in the repository are the intended statement stubs in ContinuousFOLComparator/Challenge.lean
    (the comparator Challenge), whose proofs are in ContinuousFOLComparator/Solution.lean. The proof chart
    (scripts/build_holes.py → HOLES.md) has 75 nodes, all done. Facts 4.2 and 4.3 carry one added premise
    ([Nonempty I]); see fidelity.divergences.'

    quote: '**Corollary 9.6 (Approximated Strong Completeness for Continuous Logic).** *Let $\mathcal{L}$
      be a continuous signature, let $\Gamma \subseteq \mathrm{For}(\mathcal{L})$, and let $\varphi$ be
      a formula. Then $\Gamma \vDash_Q \varphi$ if and only if $\Gamma \vdash_Q \varphi \dot{-} 2^{-n}$
      for all $n < \omega$. Moreover, if $\mathcal{L}$ is a continuous signature with a metric, then $\Gamma
      \vDash_{QC} \varphi$ if and only if $\Gamma \vdash_Q \varphi \dot{-} 2^{-n}$ for all $n < \omega$.*'

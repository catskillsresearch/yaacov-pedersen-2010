# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# yaacov-pedersen-2010: Lean 4 formalization of Ben Yaacov & Pedersen (JSL 2010), complete and sorry-free.
version: v0.4
project:
  name: Ben Yaacov–Pedersen 2010 continuous FOL completeness in Lean 4
  description: 'A Lean 4 / Mathlib formalization of Itaï Ben Yaacov and Arthur Paul Pedersen, "A proof
    of completeness for continuous first-order logic", Journal of Symbolic Logic 75 (2010) 168–190 (arXiv:0903.4051).
    Framing: rigorous reconstruction/verification of continuous propositional and first-order syntax/semantics,
    Group 1 / Group 2 axioms, black-box theorems, and the completeness / approximated strong-completeness
    results. Project rule: no Lean `axiom` declarations. Itaï Ben Yaacov and Arthur Paul Pedersen did
    not participate in or endorse this formalization. Lean is written with AI-agent assistance under Lars
    Warren Ericson’s direction and review. Mathlib is the Lake dependency. Palomar registration pending;
    packaging follows the Challenge / Solution / comparator.json pattern. Deviation from the paper: Facts
    4.2 and 4.3 (consistency iff satisfiability, Łukasiewicz and continuous propositional logic) needed
    the added premise that there is at least one propositional variable (`[Nonempty I]`). As literally
    stated they fail when there are no variables (the empty set is then satisfiable but inconsistent);
    this counterexample is proved in Lean (`LukPropForm.consistent_iff_satisfiable_fails_empty`, `CLPropForm.consistent_iff_satisfiable_fails_empty`).'
  authors:
  - Lars Warren Ericson
  license: Apache-2.0
  responsible_maintainers:
  - Lars Warren Ericson
repository:
  role: substantive-development
classification:
  arxiv:
  - math.LO
  - cs.LO
  msc2020:
  - 03B50
  - 03C66
  - 03B10
  - 68V20

    quote: '**Corollary 9.8.** *Let $\mathcal{L}$ be a continuous signature, and let $\Gamma \subseteq
      \mathrm{For}(\mathcal{L})$. Then for every formula $\varphi$, the degree of truth of $\varphi$ with
      respect to $\Gamma$ equals the degree of provability of $\varphi$ with respect to $\Gamma$. In other
      words,* $$\varphi^{\circ}_{\Gamma} = \varphi^{\circledcirc}_{\Gamma}.$$'

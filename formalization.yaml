    source: sources/yaacov_pedersen_2010_vision.md
    source_line: 605
    quote: '**Lemma 8.6.** Let $\Gamma \subseteq \mathrm{For}(\mathcal{L})$ be consistent, and let $E(\Gamma)
      := \{\Gamma'' : \Gamma \subseteq \Gamma'' \subseteq \mathrm{For}(\mathcal{L}) \text{ and } \Gamma''
      \text{ is consistent}\}$. Then $\Delta$ is a maximal member of $E(\Gamma)$ if and only if for all
      formulae $\varphi$, $\psi$, (i) $\Gamma \subseteq \Delta$ and $\Delta$ is consistent. (ii) If $\Delta
      \vdash_Q \varphi \dot{-} 2^{-n}$ for all $n < \omega$ then $\varphi \in \Delta$. (iii) $\varphi
      \dot{-} \psi \in \Delta$ or $\psi \dot{-} \varphi \in \Delta$.'

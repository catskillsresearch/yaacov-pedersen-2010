    quote: '**Theorem 9.5 (Completeness for Continuous First-Order Logic).** *Let $\mathcal{L}$ be a continuous
      signature, and let $\Gamma \subseteq \mathrm{For}(\mathcal{L})$. Then $\Gamma$ is consistent only
      if $\Gamma$ is satisfiable. Furthermore, if $\mathcal{L}$ is a continuous signature with a metric,
      then $\Gamma$ is consistent only if $\Gamma$ is completely satisfiable.*'

    quote: '**Remark 3.4.** *Observe that on any truth assignment $v$ the set $\mathcal{D}$ generated
      from $1$ by applying the operations $\neg$, $\dot{-}$, and $\frac{1}{2}$ is such that $\{v(d) :
      d \in \mathcal{D}\} = \mathbb{D}$, the set of dyadic numbers, i.e., numbers of the form $\frac{k}{2^n}$,
      where $k, n < \omega$ and $k \leq 2^n$. For simplicity of notation, we do not distinguish between
      the syntactic set $\mathcal{D}$ thus generated and $\mathbb{D}$.*'

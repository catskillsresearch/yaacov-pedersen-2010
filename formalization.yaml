    quote: '**Theorem 9.4.** Let $\mathcal{L}$ be a continuous signature (possibly with a metric), and
      let $\Gamma \subseteq \mathrm{For}(\mathcal{L})$. Assume $\Gamma$ is consistent. Then there is a
      continuous signature $\mathcal{L}^c \supseteq \mathcal{L}$, a maximal consistent and Henkin complete
      set $\Delta \subseteq \mathrm{For}(\mathcal{L}^c)$ with $\Delta \supseteq \Gamma$, a continuous
      $\mathcal{L}^c$-prestructure $\mathfrak{M}$, and an $\mathfrak{M}$-assignment $\sigma$ such that
      $(\mathfrak{M}, \sigma) \vDash_Q \Delta$.'
